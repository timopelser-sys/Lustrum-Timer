<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Voeg toe aan het bord</title>
<style>
:root{--zwart:#000;--kaart:#0d0a12;--rand:#241a33;--paars:#6a1fc2;--paars-licht:#a774ef;--tekst:#eee;--zacht:#8b80a0;--groen:#3ecf6a;--rood:#e5484d}
*{box-sizing:border-box}
html{background:var(--zwart)}
body{margin:0 auto;max-width:520px;background:var(--zwart);color:var(--tekst);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
h1{font-size:26px;margin:8px 0 4px;color:var(--paars-licht);text-wrap:balance}
.sub{color:var(--zacht);font-size:14px;margin:0 0 20px}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:700;font-size:14px}
label span{color:var(--zacht);font-weight:400}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;border-radius:12px;border:1px solid var(--rand);background:var(--kaart);color:var(--tekst);padding:12px}
textarea{min-height:90px;resize:vertical}
.foto{border:1px dashed var(--rand);border-radius:12px;padding:16px;text-align:center;background:var(--kaart);cursor:pointer;color:var(--zacht)}
.foto input{display:none}
#voorbeeld{max-width:100%;max-height:260px;border-radius:10px;margin-top:10px}
#voorbeeld[hidden]{display:none}
button{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:12px;padding:15px;background:var(--paars);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--paars-licht);outline-offset:2px}
.teller{font-size:12px;color:var(--zacht);text-align:right;margin-top:-10px}
#melding{border-radius:12px;padding:14px;font-weight:600}
#melding[hidden]{display:none}
#pauze{background:var(--kaart);border:1px solid var(--paars);border-radius:14px;padding:22px 18px;text-align:center;font-size:18px;font-weight:700;line-height:1.35;margin-bottom:16px}
#pauze[hidden],form[hidden]{display:none}
.pauzeIcoon{font-size:34px;margin-bottom:8px}
#melding.ok{background:rgba(62,207,106,.12);color:var(--groen)}
#melding.fout{background:rgba(229,72,77,.12);color:var(--rood)}
.klein{font-size:12px;color:var(--zacht);margin-top:18px}
</style>
</head>
<body>
<h1>Insturen is gesloten</h1>
<p class="sub">Prelustraal Openingsfeest · XXXV<sup>e</sup> Lustrum A.S.C./A.V.S.V.</p>
<div id="pauze"><div class="pauzeIcoon">💜</div><div>Bedankt voor al jullie berichten en foto's! Insturen is nu gesloten.</div></div>
</body>
</html>
